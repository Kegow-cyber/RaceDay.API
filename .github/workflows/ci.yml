name: RaceDay CI/CD - API and MVC

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore API and MVC
        run: dotnet restore RaceDay.sln
      - name: Build API and MVC
        run: dotnet build RaceDay.sln --no-restore -c Release
      - name: Test
        run: dotnet test --no-build --verbosity normal
      - name: Publish MVC
        run: dotnet publish RaceDay.MVC/RaceDay.MVC.csproj -c Release -o publish/mvc
      - name: Publish API
        run: dotnet publish RaceDay.API/RaceDay.API.csproj -c Release -o publish/api